version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: videoslicer-db
    environment:
      POSTGRES_DB: videoslicer
      POSTGRES_USER: videoslicer
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./internal/database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U videoslicer"]
      interval: 10s
      timeout: 5s
      retries: 5

  videoslicer:
    build: .
    container_name: videoslicer-app
    environment:
      SERVER_PORT: 8080
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: videoslicer
      DB_PASSWORD: password
      DB_NAME: videoslicer
      DB_SSLMODE: disable
      STORAGE_TASK_DIR: /app/tasks
      WORKER_MAX_CONCURRENT: 2
    ports:
      - "8080:8080"
    volumes:
      - ./tasks:/app/tasks
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data: